="413" dy="0">③ 粗光栅化</tspan><tspan x="413" dy="17">合并恢复全局顺序（sort 在此）</tspan><tspan x="413" dy="17">tile 覆盖位图 + backdrop 传播</tspan><tspan x="413" dy="17">前缀和分配输出</tspan><tspan x="413" dy="17">【部分顺序】</tspan></text></g><g class="ZmluZQ=="><g class="shape" ><rect x="289" y="840" width="248" height="98" stroke="#8FA088" fill="#DCE1D4" style="stroke-width:2;" /></g><text x="413" y="878.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="413" dy="0">④ 细光栅化</tspan><tspan x="413" dy="17.666667">解析面积积分 → coverage</tspan><tspan x="413" dy="17.666667">【乱序并行】</tspan></text></g><g class="b3V0cHV0"><g class="shape" ><rect x="351" y="1038" width="124" height="66" stroke="#7E8E75" fill="#C9D2C0" style="stroke-width:2;" /></g><text x="413" y="1076.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">输出纹理</text></g><g class="cGlsbGFyX3NjYW4="><g class="shape" ><rect x="0" y="0" width="258" height="98" stroke="#9A8E96" fill="#DED8DC" style="stroke-width:2;" /></g><text x="129" y="38.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="129" dy="0">支柱二</tspan><tspan x="129" dy="17.666667">Prefix-sum 并行化</tspan><tspan x="129" dy="17.666667">状态 → almost monoid → scan</tspan></text></g><g class="cGlsbGFyX3NvcnQ="><g class="shape" ><rect x="440" y="396" width="185" height="114" stroke="#9A8E96" fill="#DED8DC" style="stroke-width:2;" /></g><text x="532.5" y="434.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="532.5" dy="0">支柱一</tspan><tspan x="532.5" dy="17.25">Sort-middle</tspan><tspan x="532.5" dy="17.25">前段乱序并行</tspan><tspan x="532.5" dy="17.25">后段按序保正确</tspan></text></g><g class="KHNjZW5lIC0mZ3Q7IHNjYW4pWzBd"><marker id="mk-d2-3563124898-4154651752" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#9A948A" class="connec